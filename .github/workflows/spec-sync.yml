name: spec-sync
# Refreshes spec/openapi.json from the platform and opens a pull request when it changed.
# Run it from the Actions tab, or let the platform repo trigger it after an API change.
on:
  workflow_dispatch:
  repository_dispatch: { types: [platform-openapi-changed] }
permissions: { contents: write, pull-requests: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the spec
        env: { NOTIFY_OPENAPI_URL: "${{ vars.NOTIFY_OPENAPI_URL }}" }   # the platform's GET /openapi.json
        run: scripts/sync-spec.sh
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/spec-sync
          commit-message: "chore(spec): sync openapi.json from the platform"
          title: "chore(spec): sync openapi.json from the platform"
          body: |
            The platform's API contract changed. Review the diff, then update the SDKs and the shared
            fixtures in this pull request if needed (see docs/ARCHITECTURE.md).
          add-paths: spec/openapi.json
