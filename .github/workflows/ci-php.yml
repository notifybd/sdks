name: ci-php
on:
  push: { branches: [main], paths: ["packages/php/**", "spec/**", ".github/workflows/ci-php.yml"] }
  pull_request: { paths: ["packages/php/**", "spec/**", ".github/workflows/ci-php.yml"] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { php: ["8.1", "8.2", "8.3", "8.4"] }
    defaults: { run: { working-directory: packages/php } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ matrix.php }}", extensions: curl, json, tools: composer }
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer stan
      - run: composer cs
        if: matrix.php == '8.3'
