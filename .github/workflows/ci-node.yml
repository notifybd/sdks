name: ci-node
on:
  push: { branches: [main], paths: ["packages/node/**", "spec/**", ".github/workflows/ci-node.yml"] }
  pull_request: { paths: ["packages/node/**", "spec/**", ".github/workflows/ci-node.yml"] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [18, 20, 22, 24] }
    defaults: { run: { working-directory: packages/node } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm, cache-dependency-path: packages/node/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CommonJS entry loads
        run: node -e 'const s = require("./dist/index.cjs"); if (typeof s.Notify !== "function") process.exit(1)'
