[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "notifybd"
dynamic = ["version"]
description = "Official Python SDK for the Notify transactional messaging API: app-first OTP and transactional messages with SMS fallback, delivery tracking and webhook verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Notify" }]
keywords = ["notify", "sms", "otp", "bangladesh", "transactional", "webhook", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/notifybd/sdks/tree/main/packages/python"
Issues = "https://github.com/notifybd/sdks/issues"
Changelog = "https://github.com/notifybd/sdks/blob/main/packages/python/CHANGELOG.md"

[tool.hatch.version]
path = "src/notifybd/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/notifybd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Annotations stay on `typing` generics: the package supports Python 3.9 at runtime.
ignore = ["UP006", "UP007", "UP035", "UP045"]
